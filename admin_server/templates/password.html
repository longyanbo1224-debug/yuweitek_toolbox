<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 修改密码</title>
    <link href="/static/bootstrap.min.css" rel="stylesheet">
    <link href="/static/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .sidebar { width: 220px; min-height: 100vh; background: #1a1a2e; color: #c0c0d0; position: fixed; }
        .sidebar .nav-link { color: #8a8a9a; padding: 12px 20px; display: flex; align-items: center; gap: 10px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.08); color: #fff; }
        .sidebar .nav-link.active { background: rgba(255,255,255,0.15); border-left: 3px solid #4dabf7; padding-left: 17px; }
        .sidebar .nav-link i { width: 18px; text-align: center; }
        .main-content { margin-left: 220px; padding: 20px; }
    </style>
</head>
<body>
    <div class="sidebar d-flex flex-column">
        <div class="p-3 border-bottom border-secondary">
            <div class="d-flex align-items-center gap-2">
    <img src="/static/img/favicon.png" alt="logo" width="32" height="32" style="border-radius: 6px;">
    <div>
        <div style="font-size: 15px; font-weight: bold; color: #fff; line-height: 1.2;">YUWEITEK工具箱</div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.6); line-height: 1.2;">后台管理系统</div>
    </div>
</div>
            <small class="text-muted">{{ admin_user }}</small>
        </div>
        <nav class="flex-column flex-grow-1">
            <a class="nav-link" href="{{ admin_path }}/"><i class="bi bi-speedometer2"></i> 仪表盘</a>
            <a class="nav-link" href="{{ admin_path }}/licenses"><i class="bi bi-key"></i> 授权管理</a>
            <a class="nav-link" href="{{ admin_path }}/permissions"><i class="bi bi-sliders"></i> 工具权限</a>
            <a class="nav-link" href="{{ admin_path }}/import"><i class="bi bi-upload"></i> 批量导入</a>
            <a class="nav-link" href="{{ admin_path }}/logs"><i class="bi bi-journal-text"></i> 操作日志</a>
            {% if admin_role == "super_admin" %}<a class="nav-link" href="{{ admin_path }}/admins"><i class="bi bi-people"></i> 管理员管理</a>{% endif %}
            <a class="nav-link active" href="{{ admin_path }}/password"><i class="bi bi-gear"></i> 修改密码</a>
        </nav>
        <div class="p-3 border-top border-secondary">
            <a class="nav-link text-danger" href="{{ admin_path }}/logout"><i class="bi bi-box-arrow-left"></i> 退出登录</a>
        </div>
    </div>

    <div class="main-content">
        <h4 class="mb-4">修改密码</h4>
        <div class="card" style="max-width: 480px;">
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}
                {% if success %}
                <div class="alert alert-success py-2">{{ success }}</div>
                {% endif %}
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">原密码</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input type="password" name="new_password" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认新密码</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">修改密码</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
